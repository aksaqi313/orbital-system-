<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>Advanced Alarm Trigger System - Live Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.5);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #000000);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Abstract glowing background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            animation: float 10s infinite ease-in-out;
        }
        .blob-1 { width: 400px; height: 400px; background: rgba(59, 130, 246, 0.2); top: -10%; left: -10%; }
        .blob-2 { width: 500px; height: 500px; background: rgba(239, 68, 68, 0.15); bottom: -20%; right: -10%; animation-delay: -5s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -50px); }
        }

        .dashboard {
            position: relative;
            z-index: 10;
            width: 900px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .panel {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .status-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 0 30px var(--success-glow);
            border: 4px solid var(--success);
            color: var(--success);
            transition: all 0.5s ease;
            position: relative;
        }

        .status-circle.active {
            box-shadow: 0 0 50px var(--danger-glow);
            border-color: var(--danger);
            color: var(--danger);
            animation: pulse-danger 1.5s infinite;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 20px var(--danger-glow); text-shadow: 0 0 10px var(--danger); }
            50% { box-shadow: 0 0 60px var(--danger-glow), inset 0 0 20px rgba(239, 68, 68, 0.2); text-shadow: 0 0 20px var(--danger); }
            100% { box-shadow: 0 0 20px var(--danger-glow); text-shadow: 0 0 10px var(--danger); }
        }

        .status-title {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .timer-display {
            text-align: center;
            font-size: 3rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            margin-top: 10px;
            color: #e2e8f0;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-label {
            display: block;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        /* Modern Radio Buttons */
        .radio-container {
            display: flex;
            gap: 15px;
        }

        .radio-option {
            flex: 1;
        }

        .radio-option input[type="radio"] {
            display: none;
        }

        .radio-option label {
            display: block;
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .radio-option input[type="radio"]:checked + label {
            background: var(--primary);
            border-color: var(--primary-hover);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            color: white;
        }

        .radio-option input[type="radio"]:disabled + label {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Awesome Lever Switch / Trigger Button */
        .trigger-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(145deg, var(--danger), #b91c1c);
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.2);
        }

        .trigger-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
        }

        .trigger-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .trigger-btn:hover:not(:disabled)::after {
            left: 100%;
            transition: all 0.5s ease;
        }

        .trigger-btn:active:not(:disabled) {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3), inset 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        .trigger-btn:disabled {
            background: #334155;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3);
            color: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        /* Status log output */
        .log-panel {
            grid-column: 1 / -1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            font-family: monospace;
            height: 100px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            color: #a7f3d0;
        }
        
        .log-entry { margin-bottom: 5px; }
        .log-time { color: #64748b; margin-right: 10px; }
        .log-warning { color: #fcd34d; }
        .log-error { color: #fca5a5; }

    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="dashboard">
        <div class="header">
            <h1>RTMC Alarm Control Hub</h1>
            <p>Next-Generation Live Interactive Demo</p>
        </div>

        <div class="panel">
            <div class="status-title">System Status</div>
            <div class="status-circle" id="status-indicator">ON</div>
            
            <div class="status-title" style="margin-top: 15px;">Time Remaining (s)</div>
            <div class="timer-display" id="timer-display">0.0</div>
        </div>

        <div class="panel">
            <div class="control-group">
                <span class="control-label">Select Alarm State Mode</span>
                <div class="radio-container">
                    <div class="radio-option">
                        <input type="radio" id="mode-normal" name="alarm-mode" value="NORMAL" checked>
                        <label for="mode-normal">NORMAL</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="mode-alarm" name="alarm-mode" value="ALARM">
                        <label for="mode-alarm">ALARM</label>
                    </div>
                </div>
            </div>

            <div class="control-group" style="margin-top: auto; padding-top: 20px;">
                <button class="trigger-btn" id="trigger-btn">
                    Trigger Alarm
                </button>
            </div>
        </div>

        <div class="log-panel" id="log-panel">
            <div class="log-entry"><span class="log-time">[System]</span> Demo application initialized successfully.</div>
        </div>
    </div>

    <script>
        // DOM Elements
        const statusIndicator = document.getElementById('status-indicator');
        const timerDisplay = document.getElementById('timer-display');
        const triggerBtn = document.getElementById('trigger-btn');
        const modeRadios = document.getElementsByName('alarm-mode');
        const logPanel = document.getElementById('log-panel');

        // State Machine
        let isAlarmActive = false;
        let countdownTimer = 0;
        let timerInterval = null;

        // Logging function
        function addLog(msg, type = 'normal') {
            const time = new Date().toLocaleTimeString();
            let className = 'log-entry';
            if(type === 'warning') className += ' log-warning';
            if(type === 'error') className += ' log-error';
            
            const div = document.createElement('div');
            div.className = className;
            div.innerHTML = `<span class="log-time">[${time}]</span> ${msg}`;
            logPanel.appendChild(div);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // Logic function
        function updateUI() {
            if (isAlarmActive) {
                statusIndicator.classList.add('active');
                statusIndicator.innerText = 'ALARM';
                triggerBtn.disabled = true;
                triggerBtn.innerText = 'Engaged...';
                
                // Disable radios
                modeRadios.forEach(r => r.disabled = true);
            } else {
                statusIndicator.classList.remove('active');
                statusIndicator.innerText = document.querySelector('input[name="alarm-mode"]:checked').value === 'NORMAL' ? 'ON' : 'READY';
                triggerBtn.disabled = false;
                triggerBtn.innerText = 'Trigger Alarm';
                
                // Enable radios
                modeRadios.forEach(r => r.disabled = false);
            }
        }

        // Timer Tick
        function tick() {
            if (countdownTimer > 0) {
                countdownTimer -= 0.1;
                timerDisplay.innerText = Math.max(0, countdownTimer).toFixed(1);
            } else if (isAlarmActive) {
                // Alarm finished
                clearInterval(timerInterval);
                timerInterval = null;
                isAlarmActive = false;
                addLog('Alarm sequence completed. System reset to Normal.', 'normal');
                
                // Ensure radio is back to normal
                document.getElementById('mode-normal').checked = true;
                
                updateUI();
            }
        }

        // Trigger Event
        triggerBtn.addEventListener('click', () => {
            const mode = document.querySelector('input[name="alarm-mode"]:checked').value;
            
            if (mode === 'ALARM') {
                isAlarmActive = true;
                countdownTimer = 30.0; // 30 seconds demo countdown
                addLog('CRITICAL: ALARM TRIGGERED! Initiating 30-second sequence.', 'error');
                
                if (!timerInterval) {
                    timerInterval = setInterval(tick, 100);
                }
                updateUI();
            } else {
                addLog('Notice: Cannot trigger. Mode is set to NORMAL.', 'warning');
                
                // Demo effect: briefly pulse to show rejection
                triggerBtn.style.animation = 'none';
                triggerBtn.offsetHeight; /* trigger reflow */
                triggerBtn.style.animation = null; 
            }
        });

        // Mode selection event
        modeRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'ALARM') {
                    statusIndicator.innerText = 'READY';
                    statusIndicator.style.color = '#fbbf24';
                    statusIndicator.style.borderColor = '#fbbf24';
                    statusIndicator.style.boxShadow = '0 0 30px rgba(251, 191, 36, 0.4)';
                    addLog('System armed. Ready for trigger.', 'warning');
                    
                    document.getElementById('trigger-btn').style.background = 'linear-gradient(145deg, #ef4444, #b91c1c)';
                } else {
                    statusIndicator.innerText = 'ON';
                    statusIndicator.style.color = '';
                    statusIndicator.style.borderColor = '';
                    statusIndicator.style.boxShadow = '';
                    addLog('System safe mode engaged.', 'normal');
                }
            });
        });

    </script>
</body>
</html>
